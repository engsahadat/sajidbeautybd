<!-- Add this to your checkout page payment method section -->

<!-- bKash Payment Option -->
<div class="payment-method-option mb-3">
    <div class="form-check d-flex align-items-center p-3 border rounded" style="cursor: pointer;">
        <input class="form-check-input me-3" type="radio" name="payment_method" 
               id="payment_bkash" value="bkash" required>
        <label class="form-check-label d-flex align-items-center justify-content-between w-100" 
               for="payment_bkash" style="cursor: pointer;">
            <div class="d-flex align-items-center">
                <img src="https://seeklogo.com/images/B/bkash-logo-7958A209D9-seeklogo.com.png" 
                     alt="bKash" height="40" class="me-3">
                <div>
                    <strong>bKash Payment</strong>
                    <p class="mb-0 text-muted small">Pay securely with your bKash wallet</p>
                </div>
            </div>
            <i class="bi bi-chevron-right text-muted"></i>
        </label>
    </div>
</div>

<!-- SSLCommerz Payment Option -->
<div class="payment-method-option mb-3">
    <div class="form-check d-flex align-items-center p-3 border rounded" style="cursor: pointer;">
        <input class="form-check-input me-3" type="radio" name="payment_method" 
               id="payment_sslcommerz" value="sslcommerz" required>
        <label class="form-check-label d-flex align-items-center justify-content-between w-100" 
               for="payment_sslcommerz" style="cursor: pointer;">
            <div class="d-flex align-items-center">
                <img src="https://securepay.sslcommerz.com/public/image/SSLCommerz-Pay-With-logo-All-Size-05.png" 
                     alt="SSLCommerz" height="40" class="me-3">
                <div>
                    <strong>Card / Mobile Banking</strong>
                    <p class="mb-0 text-muted small">Visa, MasterCard, Rocket, Nagad & more</p>
                </div>
            </div>
            <i class="bi bi-chevron-right text-muted"></i>
        </label>
    </div>
</div>

<!-- Cash on Delivery Option -->
<div class="payment-method-option mb-3">
    <div class="form-check d-flex align-items-center p-3 border rounded" style="cursor: pointer;">
        <input class="form-check-input me-3" type="radio" name="payment_method" 
               id="payment_cod" value="cod" required>
        <label class="form-check-label d-flex align-items-center justify-content-between w-100" 
               for="payment_cod" style="cursor: pointer;">
            <div class="d-flex align-items-center">
                <i class="bi bi-cash-coin" style="font-size: 2rem;" class="me-3"></i>
                <div>
                    <strong>Cash on Delivery</strong>
                    <p class="mb-0 text-muted small">Pay when you receive your order</p>
                </div>
            </div>
            <i class="bi bi-chevron-right text-muted"></i>
        </label>
    </div>
</div>

<style>
.payment-method-option .form-check:hover {
    background-color: #f8f9fa;
    border-color: #007bff !important;
}

.payment-method-option input[type="radio"]:checked + label {
    background-color: #e7f3ff;
    border-color: #007bff !important;
}
</style>
